[package]
name = "site-daball-me"
version = "0.1.0"
authors = ["David Ball <david@daball.me>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "dioxus-rs-site-daball-me"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.1", default-features = false, features = ["document", "html", "hooks", "launch", "logger", "macro", "router", "signals"] }
dioxus-fullstack = { version = "0.7.1", features = ["server"] }
manganis = "0.7.9"
shared-daball-ui = { path = "../shared-daball-ui" }
tracing = "0.1.44"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "History",
    "PopStateEvent",
] }

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web", "shared-daball-ui/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop", "shared-daball-ui/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile", "shared-daball-ui/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server", "dioxus-fullstack/server", "shared-daball-ui/server"]
